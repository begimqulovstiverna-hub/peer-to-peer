  <script>
    // =========================================================================
    // 1. XAVFSIZ KONFIGURATSIYA VA STORAGE KALITLARI
    // =========================================================================
    const STORAGE_KEYS = {
      SECURITY: 'ep_html_security_v2',
      PROFILE: 'ep_html_profile_v2',
      CLUB: 'ep_html_club_v2',
      REMINDERS: 'ep_html_reminders_v2'
    };

    const DEFAULT_SECURITY = {
      masterKey: 'SUPER-PEERS-2026',
      tempModKey: 'MOD-DARS-2026',
      defaultDurationMinutes: 60,
      keyVersion: 1,
      accessLogs: [
        {
          id: 'log-init',
          user: 'Tizim',
          action: 'Ikki bosqichli kalit xavfsizligi va 6 darslik kurs faollashtirildi',
          time: 'Faol'
        }
      ]
    };

    // =========================================================================
    // 2. TEST SAVOLLARI GENERATORI (HAR BIR MAVZU UCHUN 30 TA, 6-MAVZUDA 50 TA)
    // =========================================================================
    function qItem(id, skill, question, options, correctIndex, explanation, advice) {
      return { id, skill, question, options, correctIndex, explanation, advice };
    }

    function buildLesson1Questions() {
      const base = [
        qItem(1, 'Alifbo va harflar', 'Ingliz alifbosida jami nechta harf bor?', ['24 ta', '26 ta', '28 ta', '30 ta'], 1, 'Ingliz alifbosida 26 ta harf mavjud (5-6 ta unli va qolgani undosh harflar).', 'Alifbodagi barcha 26 ta harfning nomini va talaffuzini yod oling.'),
        qItem(2, 'Tovushlar va unlilar', 'Ingliz tilida klassik unli harflar qaysilar?', ['A, E, I, O, U (va ba’zan Y)', 'A, O, U, I, E, Ə', 'B, C, D, F, G', 'A, E, I, O, W'], 0, 'Asosiy unli harflar A, E, I, O, U bo‘lib, Y ko‘pincha unli tovush beradi.', 'Unli harflarning qisqa va cho‘ziq tovushlarini farqlashni mashq qiling.'),
        qItem(3, 'Harflar birikmalari', '"SH" harflar birikmasi odatda qanday tovush beradi?', ['/ʃ/ ("sh")', '/tʃ/ ("ch")', '/s/ ("s")', '/ʒ/ ("j")'], 0, '"SH" birikmasi o‘zbekcha "sh" ga yaqin /ʃ/ tovushini beradi: ship, she, shop.', '"SH" (/ʃ/) va "CH" (/tʃ/) birikmalarini adashtirmang.'),
        qItem(4, 'Harflar birikmalari', '"CH" harflar birikmasi qaysi so‘zda /tʃ/ ("ch") o‘qiladi?', ['School', 'Chair', 'Chemistry', 'Character'], 1, '"Chair" so‘zida CH -> /tʃ/ o‘qiladi. (School, chemistry, characterda CH -> /k/ o‘qiladi).', '"CH" birikmasi ko‘pincha /tʃ/, lekin yunoncha so‘zlarda /k/ bo‘lishini esda tuting.'),
        qItem(5, 'Harflar birikmalari', '"PH" harflar birikmasi qaysi tovushni beradi?', ['/f/ ("f")', '/p/ ("p")', '/h/ ("h")', '/v/ ("v")'], 0, '"PH" birikmasi phone, photo, elephant so‘zlarida /f/ tovushini beradi.', '"PH" ko‘rsangiz, darhol /f/ tovushini eslang.'),
        qItem(6, 'Harflar birikmalari', '"TH" birikmasining ikki asosiy tovushi qaysilar?', ['/θ/ va /ð/', '/t/ va /d/', '/s/ va /z/', '/f/ va /v/'], 0, '"TH" jarangsiz /θ/ (think, three) va jarangli /ð/ (this, that, the) tovushlarini beradi.', 'Til uchini old tishlar orasiga qo‘yib /θ/ va /ð/ tovushlarini mashq qiling.'),
        qItem(7, 'Raqamlar', '"15" soni inglizcha qanday yoziladi va aytiladi?', ['Fifty', 'Fifteen', 'Fiveteen', 'Fiftin'], 1, '15 — fifteen (/ˌfɪfˈtiːn/), 50 esa fifty (/ˈfɪfti/).', '"-teen" (13–19) oxirgi bo‘g‘inga urg‘u beradi, "-ty" (20–90) birinchi bo‘g‘inga.'),
        qItem(8, 'Raqamlar', '"40" sonining to‘g‘ri imlosi qaysi?', ['Fourty', 'Forty', 'Fourteen', 'Forti'], 1, '40 har doim "forty" deb yoziladi ("u" harfi tushib qoladi!).', '"Four" (4) da "u" bor, lekin "forty" (40) da "u" yo‘q — imloga e’tibor bering.'),
        qItem(9, 'Raqamlar', '"12" soni inglizcha qanday aytiladi?', ['Twelf', 'Twelve', 'Twentieth', 'Two'], 1, '12 — twelve (/twelv/).', '1 dan 20 gacha bo‘lgan sonlarni yozma va og‘zaki pishiqlang.'),
        qItem(10, 'Raqamlar', '"100" raqami inglizcha qanday ifodalanadi?', ['One hundred', 'One thousand', 'Ten hundred', 'A hundredth'], 0, '100 — one hundred (yoki a hundred).', 'Yuzlik, minglik sonlarni tuzish qoidasini takrorlang.'),
        qItem(11, 'Tarjima tartibi', 'Inglizcha darak gapda so‘z tartibi qanday bo‘ladi?', ['Fe’l + Ega + To‘ldiruvchi', 'Ega + Kesim (Fe’l) + To‘ldiruvchi + Hol (Joy, Vaqt)', 'Hol + Kesim + Ega', 'To‘ldiruvchi + Ega + Fe’l'], 1, 'Ingliz tilida gap tartibi qat’iy: Subject (Ega) + Verb (Fe’l) + Object (To‘ldiruvchi) + Place + Time.', 'O‘zbekcha gapni tarjima qilayotganda avval EGA va FE’LNI toping.'),
        qItem(12, 'Tarjima tartibi', '"Men har kuni kitob o‘qiyman" gapining to‘g‘ri tartibi qaysi?', ['Every day I book read.', 'I read a book every day.', 'Read I a book every day.', 'I a book read every day.'], 1, 'Ega (I) + Fe’l (read) + To‘ldiruvchi (a book) + Vaqt holi (every day).', 'Vaqt holini (every day, tomorrow) odatda gap oxiriga qo‘ying.'),
        qItem(13, 'Tarjima tartibi', 'Joy holi va vaqt holi bir gapda kelsa, qaysi tartibda turadi?', ['Vaqt holi, keyin Joy holi', 'Joy holi, keyin Vaqt holi (Place before Time)', 'Ikkalasi ham fe’ldan oldin', 'Tartib ahamiyatsiz'], 0, 'Ingliz tilida odatda JOY holi VAQT holidan oldin keladi: "at school" (joy) + "at 9 o’clock" (vaqt).', 'Eslab qoling: Joy (Place) -> Vaqt (Time).'),
        qItem(14, 'Alifbo va harflar', '"Q" harfidan keyin odatda qaysi harf keladi?', ['U', 'A', 'O', 'E'], 0, 'Ingliz tilida "Q" harfi deyarli har doim "U" bilan birga keladi: queen, question, quick.', '"Q" harfini ko‘rsangiz, ko‘pincha yonida "U" turadi.'),
        qItem(15, 'Tovushlar va unlilar', '"C" harfi "E, I, Y" harflaridan oldin qanday o‘qiladi?', ['/s/ ("s") kabi', '/k/ ("k") kabi', '/tʃ/ ("ch") kabi', 'O‘qilmaydi'], 0, 'C + e/i/y -> /s/ (city, cent, cycle); C + a/o/u -> /k/ (cat, cup, coat).', '"C" harfining yumshoq (/s/) va qattiq (/k/) o‘qilish qoidasini yodlang.'),
        qItem(16, 'Tovushlar va unlilar', '"G" harfi "G + a/o/u" holatida qanday o‘qiladi?', ['/ɡ/ ("g") kabi', '/dʒ/ ("j") kabi', '/h/ ("h") kabi', 'O‘qilmaydi'], 0, '"Game, go, gun" so‘zlarida G -> /ɡ/ o‘qiladi.', 'G + a/o/u ko‘pincha /ɡ/ tovushini beradi.'),
        qItem(17, 'Harflar birikmalari', '"CK" birikmasi qanday tovushni beradi?', ['/k/ ("k")', '/s/ ("s")', '/tʃ/ ("ch")', '/ʃ/ ("sh")'], 0, '"CK" birikmasi qisqa unlidan keyin /k/ tovushini beradi: black, sock, clock.', '"CK" birikmasi bitta aniq /k/ tovushi beradi.'),
        qItem(18, 'Harflar birikmalari', '"NG" birikmasi so‘z oxirida qanday talaffuz qilinadi?', ['Burun orqali /ŋ/ (ming/rang oxiridagi tovushga yaqin)', 'Aniq /n/ + /ɡ/ + /ə/', '/dʒ/ ("j")', '/ʃ/ ("sh")'], 0, '"Sing, song, morning" so‘zlarida NG -> /ŋ/ burun tovushi chiqaradi.', '"Sing" so‘zida oxirida alohida "g" tovushini kuchaytirib yubormang.'),
        qItem(19, 'Raqamlar', '"8" raqami inglizcha qanday yoziladi?', ['Eigth', 'Eight', 'Eigh', 'Aight'], 1, '8 — eight (/eɪt/).', '8 (eight) va 18 (eighteen) so‘zlarining imlosini mashq qiling.'),
        qItem(20, 'Raqamlar', '"20" raqami inglizcha qanday yoziladi?', ['Twenty', 'Twinty', 'Twente', 'Twoenty'], 0, '20 — twenty (/ˈtwenti/).', 'O‘nlik sonlarni (20, 30, 40, 50...) tartib bilan yozib ko‘ring.'),
        qItem(21, 'Tarjima tartibi', '"U qiz maktabda ingliz tilini o‘rganadi" gapida EGA qaysi?', ['maktabda', 'ingliz tilini', 'U qiz (She)', 'o‘rganadi'], 2, 'Harakatni bajaruvchi shaxs — "U qiz" (She).', 'Har doim "Kim? Nima?" savoli bilan egani toping.'),
        qItem(22, 'Tarjima tartibi', 'O‘zbek tilida kesim ko‘pincha gapning oxirida kelsa, ingliz tilida qayerda turadi?', ['Oxirida', 'Egadan darhol keyin', 'Gap boshida', 'Ega bilan birga oxirida'], 1, 'Ingliz tilida kesim (fe’l) egadan darhol keyin qo‘yiladi.', 'O‘zbekchadagi "oxirgi so‘zni" inglizchada "ikkinchi o‘ringa" olib chiqing.'),
        qItem(23, 'Alifbo va harflar', '"W" harfi inglizcha qanday nomlanadi?', ['Double-u', 'Vee', 'Double-v', 'O-w'], 0, '"W" harfi "double-u" (qo‘sh U) deb aytiladi.', 'Alifbo harflarining inglizcha nomlarini takrorlang.'),
        qItem(24, 'Tovushlar va unlilar', '"Y" harfi "yellow, yes, you" so‘zlarida qanday tovush beradi?', ['/j/ ("y")', '/i/ ("i")', '/dʒ/ ("j")', '/w/ ("w")'], 0, 'So‘z boshida "Y" odatda /j/ (o‘zbekcha "y") tovushini beradi.', '"Y" so‘z boshida kelsa /j/, so‘z oxirida kelsa ko‘pincha /i/ yoki /aɪ/ bo‘ladi.'),
        qItem(25, 'Harflar birikmalari', '"SH" birikmasi qaysi so‘zda bor?', ['Fish', 'Dish', 'Wash', 'Barchasida'], 3, 'Fish, dish va wash so‘zlarining barchasida "SH" (/ʃ/) bor.', 'So‘z ichidagi va oxiridagi "SH" ni aniq talaffuz qiling.'),
        qItem(26, 'Raqamlar', '"3" raqami inglizcha qanday yoziladi?', ['Tree', 'Three', 'Thre', 'Trey'], 1, '3 — three (/θriː/). ("Tree" — daraxt degani!).', '"Three" (3) ni "th" bilan, "tree" (daraxt) ni "t" bilan farqlang.'),
        qItem(27, 'Raqamlar', '"11" raqami inglizcha qanday aytiladi?', ['Eleven', 'Eleventh', 'One-one', 'Telve'], 0, '11 — eleven (/ɪˈlevn/).', '11 dan 19 gacha bo‘lgan sonlarni alohida yodlang.'),
        qItem(28, 'Tarjima tartibi', '"Biz bugun kechqurun uyda dars qilamiz" gapida VAQT HOLI qaysi?', ['uyda', 'dars qilamiz', 'bugun kechqurun (tonight)', 'Biz'], 2, '"Bugun kechqurun" (tonight) — vaqt holi.', 'Gapdagi vaqt ifodalarini ajrata olish tarjimani osonlashtiradi.'),
        qItem(29, 'Tarjima tartibi', '"Men olma yaxshi ko‘raman" gapining to‘g‘ri inglizcha varianti qaysi?', ['Apple I like.', 'I like apples.', 'Like I apples.', 'I apples like.'], 1, 'Subject (I) + Verb (like) + Object (apples).', 'Ega -> Fe’l -> To‘ldiruvchi zanjirini mustahkamlang.'),
        qItem(30, 'Alifbo va harflar', 'Nega ingliz tilida harf bilan tovush har doim ham 100% mos kelmaydi?', ['Chunki 26 ta harf 40 dan ortiq tovushni ifodalaydi', 'Chunki alifbo noto‘g‘ri tuzilgan', 'Chunki unlilar yo‘q', 'Chunki faqat bosh harflar o‘qiladi'], 0, '26 ta harf yordamida 44 ta atrofida tovush ifodalanadi, shuning uchun transkripsiya va harf birikmalari muhim.', 'Yangi so‘z o‘rganganda ham imlosini, ham talaffuzini tekshiring.')
      ];
      return base;
    }

    function buildLesson2Questions() {
      return [
        qItem(1, 'To Be (Hozirgi zamon)', '"I ___ a first-year student." Bo‘sh o‘ringa nima qo‘yiladi?', ['am', 'is', 'are', 'were'], 0, '"I" olmoshidan keyin hozirgi zamonda "am" ishlatiladi.', '"I" -> har doim "am" (yoki o‘tmishda "was").'),
        qItem(2, 'To Be (Hozirgi zamon)', '"She ___ very kind and helpful."', ['am', 'is', 'are', 'were'], 1, '"She" (birlik, 3-shaxs) bilan hozirgi zamonda "is" qo‘llanadi.', 'He, she, it -> is.'),
        qItem(3, 'To Be (Hozirgi zamon)', '"They ___ in the classroom now."', ['am', 'is', 'are', 'was'], 2, '"They" (ko‘plik) bilan hozirgi zamonda "are" ishlatiladi.', 'We, you, they -> are.'),
        qItem(4, 'Was / Were (O‘tgan zamon)', '"Yesterday, I ___ at home all day."', ['am', 'is', 'was', 'were'], 2, '"Yesterday" o‘tgan zamonni bildiradi; "I" uchun o‘tgan zamon shakli "was".', 'O‘tgan zamon signal so‘zlariga (yesterday, last week, ago) e’tibor bering.'),
        qItem(5, 'Was / Were (O‘tgan zamon)', '"We ___ very happy after the lesson yesterday."', ['was', 'were', 'are', 'am'], 1, '"We" (ko‘plik) va "yesterday" (o‘tgan zamon) -> "were".', 'We, you, they (o‘tgan zamon) -> were.'),
        qItem(6, 'Was / Were (O‘tgan zamon)', '"He ___ tired last night."', ['was', 'were', 'is', 'am'], 0, '"He" va "last night" (o‘tgan zamon) -> "was".', 'I, he, she, it (o‘tgan zamon) -> was.'),
        qItem(7, 'Inkor va So‘roq', '"They ___ not late for the meeting." To‘g‘ri shaklni toping:', ['is', 'are', 'was', 'am'], 1, 'Ko‘plikdagi "They" bilan hozirgi zamonda "are not" (aren’t) ishlatiladi.', 'Inkor gapda "not" to be shaklidan keyin qo‘yiladi.'),
        qItem(8, 'Inkor va So‘roq', '"___ you ready for the speaking club?"', ['Is', 'Am', 'Are', 'Was'], 2, '"You" bilan hozirgi zamon so‘roq gapida "Are" gap boshiga chiqadi.', 'So‘roq gapda to be (am/is/are/was/were) egadan oldinga o‘tadi.'),
        qItem(9, 'Inkor va So‘roq', '"___ she at the library two hours ago?"', ['Is', 'Are', 'Was', 'Were'], 2, '"Two hours ago" o‘tgan zamon; "she" uchun so‘roq boshida "Was" keladi.', 'O‘tgan zamon so‘roq gaplarida "Was" yoki "Were" ni tanlang.'),
        qItem(10, 'Inkor va So‘roq', '"It ___ cold last winter." (Inkor gap)', ['wasn’t', 'weren’t', 'aren’t', 'isn’t'], 0, '"It" va "last winter" -> o‘tgan zamon inkori "wasn’t" (was not).', 'Qisqa inkor shakllarni (isn’t, aren’t, wasn’t, weren’t) mashq qiling.'),
        qItem(11, 'To Be (Hozirgi zamon)', '"My friends and I ___ ready to start."', ['am', 'is', 'are', 'was'], 2, '"My friends and I" = "We" (biz), shuning uchun "are".', 'Qo‘shma egani ("... and I") "we" ga almashtirib tekshiring.'),
        qItem(12, 'Was / Were (O‘tgan zamon)', '"The weather ___ sunny yesterday."', ['was', 'were', 'is', 'are'], 0, '"The weather" = "It" (birlik), "yesterday" -> "was".', 'Ob-havo, vaqt, masofa gaplarida ega "it" bo‘ladi.'),
        qItem(13, 'Was / Were (O‘tgan zamon)', '"The students ___ active in the last session."', ['was', 'were', 'is', 'am'], 1, '"The students" — ko‘plik, "last session" — o‘tgan zamon -> "were".', 'Ko‘plikdagi otlarga "were" qo‘llang.'),
        qItem(14, 'To Be (Hozirgi zamon)', '"This book ___ very interesting."', ['am', 'is', 'are', 'were'], 1, '"This book" — birlik -> "is".', 'Birlikdagi otlar bilan "is" (hozirgi) yoki "was" (o‘tgan).'),
        qItem(15, 'To Be (Hozirgi zamon)', '"Those books ___ on my desk."', ['am', 'is', 'are', 'was'], 2, '"Those books" — ko‘plik -> "are".', 'Ko‘plikdagi otlar bilan "are" (hozirgi) yoki "were" (o‘tgan).'),
        qItem(16, 'Inkor va So‘roq', '"Where ___ you born?"', ['was', 'were', 'is', 'am'], 1, '"You" bilan tug‘ilgan joy haqida so‘raganda "Where were you born?" deyiladi.', 'Tayyor savol qoliplarini yodlab oling.'),
        qItem(17, 'Inkor va So‘roq', '"Who ___ your first English teacher?"', ['was', 'were', 'are', 'am'], 0, '"Your first English teacher" birlikda -> "was".', 'Savol so‘zidan (Who, Where, Why) keyin to be keladi.'),
        qItem(18, 'To Be (Hozirgi zamon)', '"I ___ not angry with you."', ['am', 'is', 'are', 'were'], 0, '"I am not..." — "I’m not" ham to‘g‘ri.', '"Am not" qisqartirilganda "I’m not" bo‘ladi ("amn’t" noto‘g‘ri!).'),
        qItem(19, 'Was / Were (O‘tgan zamon)', '"___ they at home last Sunday?"', ['Was', 'Were', 'Are', 'Is'], 1, '"They" va "last Sunday" -> "Were".', 'So‘roq gapda zamon va shaxs mosligini tekshiring.'),
        qItem(20, 'To Be (Hozirgi zamon)', '"Samarkand ___ a historic city."', ['am', 'is', 'are', 'were'], 1, 'Shahar nomi (birlik) va umumiy fakt -> "is".', 'Doimiy faktlar uchun hozirgi zamon ("is") ishlatiladi.'),
        qItem(21, 'Was / Were (O‘tgan zamon)', '"When I was young, I ___ afraid of speaking English."', ['am', 'is', 'was', 'were'], 2, '"When I was young..." o‘tgan zamon hikoyasi -> "was".', 'Bitta gap ichida zamonlar mantiqiy mos kelishi kerak.'),
        qItem(22, 'Inkor va So‘roq', '"No, they ___ not at the club yesterday."', ['was', 'were', 'is', 'am'], 1, '"They" + "yesterday" + inkor -> "were not" (weren’t).', 'Javobdagi "No" ko‘pincha inkor shaklni talab qiladi.'),
        qItem(23, 'To Be (Hozirgi zamon)', '"You ___ my best peer friend."', ['am', 'is', 'are', 'was'], 1, '"You" bilan hozirgi zamonda "are" (bu yerda to‘g‘ri variantni tanlang: are).', 'Eslatma: "You" har doim "are" (hozirgi) yoki "were" (o‘tgan) oladi.'),
        qItem(24, 'To Be (Hozirgi zamon)', 'Qaysi gap grammatik jihatdan TO‘G‘RI?', ['She are a teacher.', 'They is students.', 'He is a good speaker.', 'I is ready.'], 2, '"He is a good speaker." — to‘g‘ri tuzilgan gap.', 'Har bir shaxsga mos to be shaklini adashtirmang.'),
        qItem(25, 'Was / Were (O‘tgan zamon)', 'Qaysi gap O‘TGAN ZAMONDA to‘g‘ri tuzilgan?', ['We was at school yesterday.', 'We were at school yesterday.', 'We are at school yesterday.', 'We is at school yesterday.'], 1, '"We were at school yesterday." — to‘g‘ri.', 'We + were + yesterday.'),
        qItem(26, 'Inkor va So‘roq', '"Is he at home?" savoliga qisqa tasdiq javob qaysi?', ['Yes, he is.', 'Yes, he’s.', 'Yes, he are.', 'Yes, he was.'], 0, 'Qisqa tasdiq javobda qisqartma ("he’s") ishlatilmaydi: "Yes, he is."', 'Qisqa tasdiq javobda "Yes, + olmosh + am/is/are/was/were" shaklida yozing.'),
        qItem(27, 'Inkor va So‘roq', '"Were they tired?" savoliga qisqa inkor javob qaysi?', ['No, they wasn’t.', 'No, they weren’t.', 'No, they aren’t.', 'No, they don’t.'], 1, '"No, they weren’t." (yoki "No, they were not.")', 'Qisqa inkor javobda "No, + olmosh + isn’t/aren’t/wasn’t/weren’t" ishlatiladi.'),
        qItem(28, 'To Be (Hozirgi zamon)', '"My bag and my notebook ___ on the table."', ['is', 'are', 'was', 'am'], 1, 'Ikki narsa ("bag and notebook") = ko‘plik -> "are".', 'Bir nechta narsa sanalsa, ko‘plik shakli ("are") ishlatiladi.'),
        qItem(29, 'Was / Were (O‘tgan zamon)', '"Why ___ you absent yesterday?"', ['was', 'were', 'is', 'do'], 1, '"You" uchun o‘tgan zamonda "were" ishlatiladi.', '"Why were you...?" — foydali savol qolipi.'),
        qItem(30, 'To Be / Was-Were', 'To be fe’li o‘zbek tiliga qanday tarjima qilinadi?', ['Hozirgi zamonda ko‘pincha tushirib qoldiriladi ("-dir"/mavjud), o‘tgan zamonda "edi/bo‘lgan edi"', 'Faqat "bormoq" deb', 'Faqat "qilmoq" deb', 'Tarjima qilinmaydi'], 0, 'O‘zbek tilida "Men talabaman" deb aytiladi ("man" so‘zi shart emas), lekin inglizchada "I am a student" shart!', 'Inglizcha gapda to be ni tushirib qoldirmang.')
      ].map((item, idx) => {
        // Fix item 23 option so index 2 is "are"
        if (idx === 22) {

        <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${
          isWarn ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-400'
        }">${isWarn ? '⚠️' : '✓'}</span>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 3400);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getRemainingModMs() {
      if (!state.profile || state.profile.activeRole !== 'temp_moderator') return 0;
      return Math.max(0, (state.profile.modExpiresAt || 0) - Date.now());
    }

    function formatRemainingTime(ms) {
      if (ms <= 0) return '00:00';
      const totalSec = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      return `${pad(mins)}:${pad(secs)}`;
    }

      const me = state.profile ? state.profile.fullName : '';
      const online = window.EPApi && window.EPApi.ready;
      const list = online
        ? (state.hwList || [])
        : (state.club.submissions || []).map((s) => ({ ...s, mine: s.userName === me }));
      // Oddiy o‘quvchi faqat o‘z vazifasini ko‘radi; moderator hammasini
      return hasModeratorPowers() ? list : list.filter((s) => s.mine);
    }

    async function loadHomework() {
      if (!(window.EPApi && window.EPApi.ready)) return;
      try {
        const r = await window.EPApi.homeworkList();
        state.hwList = r.items || [];
        // Moderator bergan nishon va XP o‘quvchiga bir marta qo‘shiladi
        const p = state.profile;
        if (p) {
          p.appliedAwards = p.appliedAwards || [];
          p.awardedBadges = p.awardedBadges || [];
          let changed = false;
          for (const s of state.hwList) {
            const key = 'hw-' + s.id;
            if (s.mine && s.badge && AWARD_BADGES[s.badge] && !p.appliedAwards.includes(key)) {
              p.appliedAwards.push(key);
              if (!p.awardedBadges.includes(s.badge)) p.awardedBadges.push(s.badge);
              addXp(s.badgeXp || AWARD_BADGES[s.badge].xp, 'Nishon: ' + AWARD_BADGES[s.badge].title);
              showToast(`🏅 Yangi nishon: ${AWARD_BADGES[s.badge].title}`);
              changed = true;
            }
          }
          if (changed) persistAll();
        }
        render();
      } catch {}
    }

    function isSuperAdmin() {
      return state.profile?.activeRole === 'super_admin';
    }

    function isTempModerator() {
      return state.profile?.activeRole === 'temp_moderator' && getRemainingModMs() > 0;
    }

    function hasModeratorPowers() {
      return isSuperAdmin() || isTempModerator();

    function addXp(amount, logText) {
      if (!state.profile) return;
      state.profile.xp = (state.profile.xp || 0) + amount;
      state.profile.history = [
        { text: `${logText} (+${amount} XP)`, time: 'Hozirgina' },
        ...(state.profile.history || []).slice(0, 9)
      ];
      persistAll();
    }

    function evaluateSecretKey(enteredKey, userFullName = 'A’zo') {
      const cleanKey = (enteredKey || '').trim();
      if (!cleanKey) return { valid: false, error: 'Kalit so‘z kiritilmadi.' };

      if (cleanKey === state.security.masterKey) {
        state.security.accessLogs = [
          {
            id: 'log-' + Date.now(),
            user: userFullName,
            action: 'Bosh Tashkilotchi sifatida tizimga kirdi',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          },
          ...(state.security.accessLogs || []).slice(0, 9)
        ];
        persistAll();
        return { valid: true, role: 'super_admin', expiresAt: null, keyVersion: state.security.keyVersion };
      }

      if (cleanKey === state.security.tempModKey) {
        const durationMin = state.security.defaultDurationMinutes || 60;
        const expiresAt = Date.now() + durationMin * 60 * 1000;
        state.security.accessLogs = [
          {
            id: 'log-' + Date.now(),
            user: userFullName,
            action: `Vaqtinchalik Moderator oldi (${durationMin} daqiqa)`,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          },
          ...(state.security.accessLogs || []).slice(0, 9)
        ];
        persistAll();
        return { valid: true, role: 'temp_moderator', expiresAt, keyVersion: state.security.keyVersion };
      }

      return { valid: false, error: 'Noto‘g‘ri maxsus kalit so‘z!' };
    }

    function speakEnglish(text, accent = state.ttsAccent, rate = state.ttsRate) {
      if (!text || !text.trim()) return;
      if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
        showToast('Brauzeringizda ovozli o‘qish (TTS) qo‘llab-quvvatlanmaydi.', 'warning');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.trim());
        utter.lang = accent;
        utter.rate = rate;
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const matched =
          voices.find((v) => v.lang === accent && (v.name.includes('Google') || v.name.includes('Natural'))) ||
          voices.find((v) => v.lang && v.lang.startsWith(accent.slice(0, 5))) ||
          voices.find((v) => v.lang && v.lang.startsWith('en'));
        if (matched) utter.voice = matched;
        window.speechSynthesis.speak(utter);
      } catch {
        showToast('Ovozni ijro etishda xatolik yuz berdi.', 'warning');
      }
    }

    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    setInterval(() => {
      if (!state.profile) return;
      if (state.profile.activeRole === 'temp_moderator') {
        const now = Date.now();
        const expired = now >= (state.profile.modExpiresAt || 0);
        const rotated = state.profile.modKeyVersion !== state.security.keyVersion;
        if (expired || rotated) {
          state.profile.activeRole = state.profile.baseRole || 'learner';
          state.profile.modExpiresAt = null;
          state.profile.modKeyVersion = null;
          persistAll();
          showToast(rotated ? 'Kalit yangilandi, oddiy rolga qaytdingiz.' : 'Moderatorlik muddati tugadi.', 'warning');
          render();
          return;
        }
      }
      const timerEl = document.getElementById('live-mod-timer');
      if (timerEl) timerEl.textContent = formatRemainingTime(getRemainingModMs());
      const profileTimerEl = document.getElementById('profile-mod-timer');
      if (profileTimerEl) profileTimerEl.textContent = formatRemainingTime(getRemainingModMs());
    }, 1000);

    function notifTimeAgo(s) {
      const t = new Date(String(s || '').replace(' ', 'T') + 'Z').getTime();
      if (!t) return '';
      const m = Math.floor((Date.now() - t) / 60000);
      if (m < 1) return 'hozirgina';
      if (m < 60) return m + ' daqiqa oldin';
      const hr = Math.floor(m / 60);
      if (hr < 24) return hr + ' soat oldin';
      return Math.floor(hr / 24) + ' kun oldin';
    }

    function renderBottomNav() {

              const active = state.activeTab === t.id;
              return `
                <button
                  onclick="switchTab('${t.id}')"

    function renderActiveTabContent() {
      switch (state.activeTab) {

          return renderPronunciationTab();
        case 'lessons':
          return renderLessonsTab();

    // =========================================================================
    // 6. JADVALLAR VA RESURSLAR BO'LIMI (1–6 DARSLAR)
    // =========================================================================
    function renderScheduleTab() {
      const modPowers = hasModeratorPowers();
      const days = ['Barchasi', ...Array.from(new Set(state.club.schedules.map((s) => s.day)))];
      const list =
        state.scheduleDayFilter === 'Barchasi'
          ? state.club.schedules
          : state.club.schedules.filter((s) => s.day === state.scheduleDayFilter);

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900">Darslar Jadvali va Resurslar</h2>
              <p class="text-xs text-slate-500">19-noyabrdan 28-noyabrgacha 6 ta dars, test va lug‘at</p>
            </div>
            ${
              modPowers
                ? `<button onclick="openNewScheduleModal()" class="bg-indigo-600 text-white px-3 py-2.5 rounded-xl text-xs font-bold shadow-sm shrink-0">+ Dars</button>`
                : `<button onclick="switchTab('profile')" class="bg-slate-200/80 text-slate-600 px-3 py-2 rounded-xl text-[11px] font-bold shrink-0">🔒 Moderator</button>`
            }
          </div>

          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
            ${days
              .map((d) => {
                const active = state.scheduleDayFilter === d;
                return `
                  <button
                    onclick="setScheduleDayFilter('${escapeHtml(d)}')"
                    class="shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${
                      active ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200'
                    }"
                  >
                    ${escapeHtml(d)}
                  </button>
                `;
              })
              .join('')}
          </div>

          <div class="space-y-3.5">
            ${list
              .map((s) => {
                const isGoing = (s.rsvps || []).includes(state.profile.fullName);
                const hasSpeaker = Boolean(s.speakerName);
                const remOn = Boolean(state.reminders[s.id]);
                const qCount = (s.questions || []).length;
                const vocabCount = (s.resources?.vocab || []).length;
                const tState = state.lessonTestStates[s.id];
                let scoreBadge = '';
                if (tState && tState.submitted) {
                  const correctCnt = (s.questions || []).filter((q) => tState.answers[q.id] === q.correctIndex).length;
                  const pct = qCount ? Math.round((correctCnt / qCount) * 100) : 0;
                  scoreBadge = `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800">Test: ${pct}%</span>`;
                }

                return `
                  <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                    <div class="flex items-center justify-between gap-2">
                      <div class="flex flex-wrap items-center gap-1.5">
                        <span class="bg-indigo-600 text-white text-xs font-extrabold px-2.5 py-1 rounded-lg">
                          ${escapeHtml(s.day)} • ${escapeHtml(s.date)}
                        </span>
                        <span class="bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold px-2.5 py-1 rounded-lg">
                          🕒 ${escapeHtml(s.time)}
                        </span>
                        ${scoreBadge}
                      </div>
                      <button
                        onclick="toggleLessonReminder('${escapeHtml(s.id)}', '${escapeHtml(s.topic)}')"
                        class="p-2 rounded-xl border text-xs ${
                          remOn ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-slate-50 border-slate-200 text-slate-400'
                        }"
                        title="Eslatma"
                      >
                        ${remOn ? '🔔' : '🔕'}
                      </button>
                    </div>

                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">
                          ${escapeHtml(s.level)}
                        </span>
                        <span class="text-[11px] text-slate-500">📍 ${escapeHtml(s.location)}</span>
                      </div>
                      <h3 class="font-extrabold text-slate-900 text-sm leading-snug">${escapeHtml(s.topic)}</h3>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-2.5 flex items-center justify-between border border-slate-100">
                      <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-sm font-bold">
                          🎙️
                        </div>
                        <div>
                          <div class="text-[10px] uppercase font-bold text-slate-400">Dars Spikeri / Moderator</div>
                          ${
                            hasSpeaker
                              ? `<div class="text-xs font-bold text-slate-800">${escapeHtml(s.speakerName)}</div>`
                              : `<div class="text-xs font-medium text-amber-600">Bo‘sh (Spiker kerak)</div>`
                          }
                        </div>
                      </div>
                      ${
                        !hasSpeaker
                          ? `<button onclick="claimSpeaker('${escapeHtml(s.id)}')" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-sm">
                              Spiker bo‘lish (+50 XP)
                            </button>`
                          : ''
                      }
                    </div>

                    <!-- Resurslar, Tushuntirish, Test va Lug'atni ochish tugmalari -->
                    <div class="grid grid-cols-2 gap-2">
                      <button
                        onclick="openResourcesModal('${escapeHtml(s.id)}', 'explanation')"
                        class="py-2.5 px-3 rounded-2xl bg-indigo-50 hover:bg-indigo-100 border border-indigo-200/80 text-left transition-all"
                      >
                        <div class="text-xs font-extrabold text-indigo-950">📖 Tushuntirish</div>
                        <div class="text-[10px] text-indigo-700">To‘liq qoida va misollar</div>
                      </button>

                      <button
                        onclick="openResourcesModal('${escapeHtml(s.id)}', 'test')"
                        class="py-2.5 px-3 rounded-2xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/80 text-left transition-all"
                      >
                        <div class="text-xs font-extrabold text-emerald-950">📝 Mavzu Testi (${qCount})</div>
                        <div class="text-[10px] text-emerald-700">Natija va % tahlili</div>
                      </button>
                    </div>

                    <button
                      onclick="openResourcesModal('${escapeHtml(s.id)}', 'vocab')"
                      class="w-full py-2.5 px-3.5 rounded-2xl bg-amber-50/80 hover:bg-amber-100/80 border border-amber-200/80 flex items-center justify-between transition-all text-left"
                    >
                      <div>
                        <div class="text-xs font-extrabold text-amber-950">✍️ Dars lug‘ati (Moderator qo‘lda to‘ldiradi)</div>
                        <div class="text-[10px] text-amber-800">Kiritilgan so‘zlar: <strong>${vocabCount} ta</strong> • Ovozli talaffuz</div>
                      </div>
                      <span class="text-amber-700 font-bold text-sm">›</span>
                    </button>

                    <div class="flex items-center justify-between pt-0.5 gap-2">
                      <button
                        onclick="toggleRsvp('${escapeHtml(s.id)}')"
                        class="flex-1 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${
                          isGoing ? 'bg-emerald-600 text-white shadow-sm' : 'bg-indigo-50 text-indigo-700'
                        }"
                      >
                        <span>${isGoing ? 'Qatnashaman ✓' : 'Yozilish'}</span>
                        <span class="bg-black/15 px-1.5 py-0.5 rounded-md text-[10px]">${(s.rsvps || []).length}</span>
                      </button>

                      ${
                        modPowers
                          ? `<button onclick="openAttendanceModal('${escapeHtml(s.id)}')" class="py-2.5 px-3.5 rounded-xl bg-slate-900 text-white text-xs font-bold shadow-sm">
                              Davomat ✅
                            </button>`
                          : `<span class="py-2.5 px-3 rounded-xl bg-slate-100 text-slate-500 text-[11px] font-semibold">🔒 Davomat</span>`
                      }
                    </div>
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 7. RESURSLAR MODALI: TUSHUNTIRISH + 30/50 SAVOLLIK TEST + TAHLIL + LUG'AT
    // =========================================================================
    function openResourcesModal(schedId, tab = 'explanation') {
      state.activeResourceTab = tab;
      const sched = state.club.schedules.find((s) => s.id === schedId);
      if (!sched) return;
      const res = sched.resources || { fullExplanation: '', vocab: [], socialLinks: [] };
      const questions = sched.questions || [];
      const tState = getLessonTestState(sched.id);
      const canEdit = hasModeratorPowers() || sched.speakerName === state.profile?.fullName;

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/65 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-slate-50 w-full max-w-md rounded-t-3xl sm:rounded-3xl h-[94vh] flex flex-col shadow-2xl overflow-hidden animate-fade-in">
            <!-- Header -->
            <div class="bg-gradient-to-r from-indigo-700 to-emerald-600 text-white p-4 flex items-start justify-between gap-2 shrink-0">
              <div>
                <div class="text-[11px] text-indigo-100 font-bold">${escapeHtml(sched.day)}, ${escapeHtml(sched.date)} • ${escapeHtml(sched.time)}</div>
                <h3 class="font-extrabold text-sm leading-snug mt-0.5">${escapeHtml(sched.topic)}</h3>
              </div>
              <button onclick="closeModal()" class="p-2 rounded-full bg-white/15 hover:bg-white/25 text-white text-xs font-bold shrink-0">✕</button>
            </div>

            <!-- Ichki bo'limlar: Tushuntirish | Test (30/50) | Lug'at | Havola -->
            <div class="bg-white border-b border-slate-200 px-3 py-2 grid grid-cols-4 gap-1 shrink-0">
              ${[
                { id: 'explanation', label: '📖 Dars' },
                { id: 'test', label: `📝 Test (${questions.length})` },
                { id: 'vocab', label: `✍️ Lug‘at (${(res.vocab || []).length})` },
                { id: 'links', label: '🔗 Havola' }
              ]
                .map(
                  (tb) => `<button
                    onclick="openResourcesModal('${escapeHtml(sched.id)}', '${tb.id}')"
                    class="py-2 px-1 rounded-xl text-[11px] font-bold transition-all ${
                      state.activeResourceTab === tb.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600'
                    }"
                  >${tb.label}</button>`
                )
                .join('')}
            </div>

            <!-- Body -->
            <div id="resource-modal-body" class="flex-1 overflow-y-auto p-4 space-y-4">
              ${renderResourceModalBody(sched, res, questions, tState, canEdit)}
            </div>
          </div>
        </div>
      `;
    }

    function renderResourceModalBody(sched, res, questions, tState, canEdit) {
      if (state.activeResourceTab === 'explanation') {
        return `
          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
            <div class="flex items-center justify-between">
              <span class="font-extrabold text-sm text-slate-900">Mavzuni to‘liq tushuntirish</span>
              <button onclick="speakEnglish(document.getElementById('expl-text-box').innerText, state.ttsAccent, 0.95)" class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-[11px] font-bold">
                🔊 O‘qish
              </button>
            </div>
            <div id="expl-text-box" class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 text-xs text-slate-800 whitespace-pre-line leading-relaxed">
              ${escapeHtml(res.fullExplanation)}
            </div>

            ${
              canEdit
                ? `<div class="pt-2 space-y-2 border-t border-slate-100">
                    <label class="block text-[11px] font-bold text-indigo-700">Qo‘shimcha izoh yoki misol qo‘shish:</label>
                    <textarea id="res-append-note" rows="2" placeholder="Qo‘shimcha tushuntirishni yozing..." class="w-full p-2.5 rounded-xl border border-slate-200 text-xs"></textarea>
                    <button onclick="appendLessonNote('${escapeHtml(sched.id)}')" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">
                      + Tushuntirishga qo‘shish
                    </button>
                  </div>`
                : ''
            }
          </div>

          <!-- Dars tugagach testga o'tish chaqiruvi -->
          <div class="bg-gradient-to-r from-indigo-600 to-emerald-600 text-white rounded-3xl p-4 shadow-md space-y-2.5">
            <div class="text-xs font-extrabold">Mavzu tushunarli bo‘ldimi? Endi bilimingizni tekshiring!</div>
            <p class="text-[11px] text-indigo-100">
              Pastda ushbu mavzu bo‘yicha <strong>${questions.length} ta test savoli</strong> va natijani tahlil qilish (o‘zlashtirish foizi, tushuntirish va maslahatlar) tayyorlangan.
            </p>
            <button onclick="openResourcesModal('${escapeHtml(sched.id)}', 'test')" class="w-full py-3 rounded-2xl bg-white text-indigo-950 font-extrabold text-xs shadow">
              📝 ${questions.length} talik testni boshlash →
            </button>
          </div>
        `;
      }

      if (state.activeResourceTab === 'test') {
        const answeredCount = Object.keys(tState.answers || {}).length;
        if (!tState.submitted) {
          return `
            <div class="bg-white rounded-3xl p-3.5 border border-slate-200/80 flex items-center justify-between gap-2 sticky top-0 z-10 shadow-sm">
              <div>
                <div class="text-xs font-extrabold text-slate-900">Mavzu Testi: ${questions.length} ta savol</div>
                <div class="text-[11px] text-slate-500">Javob berilgan: <strong>${answeredCount} / ${questions.length}</strong></div>
              </div>
              <button onclick="submitLessonTest('${escapeHtml(sched.id)}')" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow">
                Yakunlash va Tahlil
              </button>
            </div>

            <div class="space-y-3">
              ${questions
                .map((q, idx) => {
                  const picked = tState.answers[q.id];
                  return `
                    <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-2.5">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">
                          Savol ${idx + 1} / ${questions.length}
                        </span>
                        <span class="text-[10px] font-semibold text-slate-400">${escapeHtml(q.skill)}</span>
                      </div>
                      <p class="text-xs font-bold text-slate-900 leading-snug">${escapeHtml(q.question)}</p>
                      <div class="space-y-1.5">
                        ${q.options
                          .map((opt, oIdx) => {
                            const selected = picked === oIdx;
                            return `
                              <button
                                type="button"
                                onclick="pickLessonTestOption('${escapeHtml(sched.id)}', ${q.id}, ${oIdx})"
                                class="w-full text-left px-3 py-2.5 rounded-xl border text-xs transition-all ${
                                  selected
                                    ? 'bg-indigo-600 border-indigo-600 text-white font-bold'
                                    : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                                }"
                              >
                                ${String.fromCharCode(65 + oIdx)}) ${escapeHtml(opt)}
                              </button>
                            `;
                          })
                          .join('')}
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>

            <button onclick="submitLessonTest('${escapeHtml(sched.id)}')" class="w-full py-3.5 rounded-2xl bg-emerald-600 text-white font-extrabold text-xs shadow-lg">
              📊 Testni yakunlash va natijani tahlil qilish (${answeredCount}/${questions.length})
            </button>
          `;
        }

        // Test topshirilgach: O'zlashtirish foizi, Bo'limlar tahlili, Tavsiyalar va Savollar tahlili
        return renderTestAnalysis(sched, questions, tState);
      }

      if (state.activeResourceTab === 'vocab') {
        const vocabItems = res.vocab || [];
        return `
          ${
            canEdit
              ? `<form onsubmit="addLessonManualVocab(event, '${escapeHtml(sched.id)}')" class="bg-white rounded-3xl p-4 border border-amber-200 shadow-sm space-y-2.5">
                  <div class="flex items-center justify-between">
                    <h4 class="font-extrabold text-xs text-slate-900">✍️ Dars lug‘atini qo‘lda yozib to‘ldirish</h4>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Moderator</span>
                  </div>
                  <p class="text-[11px] text-slate-500">Dars davomida ishlatilgan so‘z yoki iborani qo‘lda yozib kiriting:</p>
                  <div class="grid grid-cols-2 gap-2">
                    <input id="lv-word" required placeholder="Inglizcha so‘z / ibora *" class="px-3 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold" />
                    <input id="lv-uz" required placeholder="O‘zbekcha tarjimasi *" class="px-3 py-2.5 rounded-xl border border-slate-200 text-xs" />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <input id="lv-trans" placeholder="Transkripsiya (masalan: /wɜːd/)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs font-mono" />
                    <input id="lv-ex" placeholder="Namuna gap (ixtiyoriy)" class="px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs shadow">
                    + Lug‘at ro‘yxatiga qo‘shish
                  </button>
                </form>`
              : `<div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-900">
                  Dars lug‘atini dars moderatori / spikeri qo‘lda yozib to‘ldiradi. Pastda darsda ishlatilgan so‘zlarni ko‘rib, ovozli tinglashingiz mumkin.
                </div>`
          }

          <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-2.5">
            <h4 class="font-extrabold text-sm text-slate-900">Dars bo‘yicha ishlatilgan lug‘at (${vocabItems.length} ta)</h4>
            ${
              vocabItems.length
                ? vocabItems
                    .map(
                      (v, i) => `
                  <div class="p-3 rounded-2xl bg-slate-50 border border-slate-100 flex items-start justify-between gap-2">

    function renderTestAnalysis(sched, questions, tState) {
      const total = questions.length;
      let correctCount = 0;
      const skillStats = {}; // { [skill]: { total: 0, correct: 0, advice: '' } }

      questions.forEach((q) => {
        if (!skillStats[q.skill]) {
          skillStats[q.skill] = { total: 0, correct: 0, advice: q.advice };
        }
        skillStats[q.skill].total += 1;
        if (tState.answers[q.id] === q.correctIndex) {
          correctCount += 1;
          skillStats[q.skill].correct += 1;
        }
      });

      const pct = total ? Math.round((correctCount / total) * 100) : 0;
      let levelTitle = 'Boshlang‘ich bosqich';
      let generalAdvice = 'Mavzu tushuntirishini yana bir bor o‘qib chiqing va har bir qoidani 3 tadan misol bilan mustahkamlang.';
      if (pct >= 85) {
        levelTitle = 'A’lo darajada o‘zlashtirildi! 🌟';
        generalAdvice = 'Mavzuni juda puxta o‘zlashtirdingiz! Endi o‘rgangan qoidalaringizni og‘zaki nutqda va yangi gaplar tuzishda faol ishlating.';
      } else if (pct >= 65) {
        levelTitle = 'Yaxshi o‘zlashtirildi 👍';
        generalAdvice = 'Asosiy qoidalarni tushungansiz. Pastdagi past foizli bo‘limlarga alohida e’tibor qarating va xato qilingan savollar izohini o‘qing.';
      } else if (pct >= 40) {
        levelTitle = 'O‘rtacha — mustahkamlash zarur ⚡';
        generalAdvice = 'Ayrim jihatlar chalkashmoqda. Har bir xato savolning izohini o‘qib, dars lug‘atidagi so‘zlarni qayta takrorlang.';
      }

      const weakSkills = Object.entries(skillStats)
        .map(([name, st]) => ({ name, pct: Math.round((st.correct / st.total) * 100), ...st }))
        .sort((a, b) => a.pct - b.pct);

      const filteredQuestions = questions.filter((q) => {
        const isRight = tState.answers[q.id] === q.correctIndex;
        if (tState.reviewFilter === 'wrong') return !isRight;
        if (tState.reviewFilter === 'right') return isRight;
        return true;
      });

      return `
        <!-- Umumiy o'zlashtirish foizi -->
        <div class="bg-gradient-to-br from-indigo-700 via-indigo-600 to-emerald-600 text-white rounded-3xl p-4 shadow-md space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-extrabold uppercase tracking-wide text-indigo-100">Natija va O‘zlashtirish Tahlili</span>
            <span class="text-xs font-bold bg-white/20 px-2.5 py-0.5 rounded-full">${correctCount} / ${total} to‘g‘ri</span>
          </div>

          <div class="flex items-end justify-between">
            <div>
              <div class="text-3xl font-black">${pct}%</div>
              <div class="text-xs font-bold text-amber-200 mt-0.5">${escapeHtml(levelTitle)}</div>
            </div>
            <button onclick="retakeLessonTest('${escapeHtml(sched.id)}')" class="px-3.5 py-2 rounded-xl bg-white text-indigo-950 font-extrabold text-xs shadow">
              ↻ Qayta ishlash
            </button>
          </div>

          <div class="w-full h-2.5 bg-black/20 rounded-full overflow-hidden">
            <div class="h-full bg-amber-300 rounded-full transition-all" style="width: ${pct}%"></div>
          </div>

          <div class="bg-black/15 p-3 rounded-2xl text-xs text-indigo-50 leading-relaxed">
            <strong>💡 Umumiy maslahat:</strong> ${escapeHtml(generalAdvice)}
          </div>
        </div>

        <!-- Mavzu ichidagi bo'limlar bo'yicha o'zlashtirish foizi -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
          <h4 class="font-extrabold text-sm text-slate-900">📈 Bo‘limlar kesimida o‘zlashtirish foizi</h4>
          <div class="space-y-2.5">
            ${weakSkills
              .map((sk) => {
                const barColor = sk.pct >= 80 ? 'bg-emerald-500' : sk.pct >= 50 ? 'bg-amber-500' : 'bg-rose-500';
                return `
                  <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-100 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-bold text-slate-800">${escapeHtml(sk.name)}</span>
                      <span class="font-extrabold text-slate-900">${sk.pct}% (${sk.correct}/${sk.total})</span>
                    </div>
                    <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
                      <div class="h-full ${barColor} rounded-full" style="width: ${sk.pct}%"></div>
                    </div>
                    ${
                      sk.pct < 80
                        ? `<p class="text-[11px] text-slate-600"><strong>Tavsiya:</strong> ${escapeHtml(sk.advice)}</p>`
                        : ''
                    }
                  </div>
                `;
              })
              .join('')}
          </div>
        </div>

        <!-- Savollar bo'yicha batafsil tushuntirish -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-sm space-y-3">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <h4 class="font-extrabold text-sm text-slate-900">🔍 Savollar tahlili va tushuntirish</h4>
            <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
              ${[
                { id: 'all', label: `Barchasi (${total})` },
                { id: 'wrong', label: `Xatolar (${total - correctCount})` },
                { id: 'right', label: `To‘g‘ri (${correctCount})` }
              ]
                .map(
                  (f) => `<button
                    onclick="setTestReviewFilter('${escapeHtml(sched.id)}', '${f.id}')"
                    class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${
                      tState.reviewFilter === f.id ? 'bg-indigo-600 text-white' : 'text-slate-600'
                    }"
                  >${f.label}</button>`
                )
                .join('')}
            </div>
          </div>

          <div class="space-y-2.5">
            ${
              filteredQuestions.length
                ? filteredQuestions
                    .map((q) => {
                      const picked = tState.answers[q.id];
                      const isRight = picked === q.correctIndex;
                      return `
                        <div class="p-3 rounded-2xl border ${
                          isRight ? 'bg-emerald-50/40 border-emerald-200' : 'bg-rose-50/40 border-rose-200'
                        } space-y-1.5">
                          <div class="flex items-center justify-between text-[10px] font-bold">
                            <span class="text-slate-500">#${q.id} • ${escapeHtml(q.skill)}</span>
                            <span class="${isRight ? 'text-emerald-700' : 'text-rose-700'}">${isRight ? '✓ To‘g‘ri' : '✕ Xato'}</span>
                          </div>
                          <div class="text-xs font-bold text-slate-900">${escapeHtml(q.question)}</div>
                          <div class="text-[11px] text-slate-700">
                            Sizning javobingiz: <strong>${picked !== undefined ? escapeHtml(q.options[picked]) : 'Belgilanmagan'}</strong>
                          </div>
                          ${
                            !isRight
                              ? `<div class="text-[11px] font-bold text-emerald-800">To‘g‘ri javob: ${escapeHtml(q.options[q.correctIndex])}</div>`
                              : ''
                          }
                          <div class="text-[11px] text-slate-700 bg-white/80 p-2 rounded-xl border border-slate-100">
                            <strong>Tushuntirish:</strong> ${escapeHtml(q.explanation)}
                          </div>
                        </div>
                      `;
                    })
                    .join('')
                : `<p class="text-xs text-slate-400 text-center py-3">Bu filtr bo‘yicha savollar topilmadi.</p>`
            }
          </div>
        </div>
      `;
    }

    function openAttendanceModal(schedId) {
      if (!hasModeratorPowers()) return;
      const sched = state.club.schedules.find((s) => s.id === schedId);
      if (!sched) return;
      const roster = Array.from(new Set([state.profile.fullName, 'Jo‘rabek Esirgapov', 'Abdullayev Ulug‘bek', ...(sched.rsvps || [])]));
      const att = sched.attendance || {};

      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between pb-3 border-b">
              <h3 class="font-extrabold text-base">Davomat — ${escapeHtml(sched.date)}</h3>
              <button onclick="closeModal()" class="p-2 rounded-full bg-slate-100 text-xs font-bold">✕</button>
            </div>
            <div class="flex-1 overflow-y-auto py-3 space-y-2.5">
              ${roster
                .map((name) => {
                  const cur = att[name] || 'present';
                  return `<div class="p-3 rounded-2xl bg-slate-50 border space-y-2" data-att-name="${escapeHtml(name)}" data-att-val="${escapeHtml(cur)}">
                    <div class="text-xs font-bold">${escapeHtml(name)}</div>
                    <div class="grid grid-cols-4 gap-1.5">
                      ${[
                        { id: 'present', label: 'Keldi ✅', cls: 'bg-emerald-600 text-white' },
                        { id: 'late', label: 'Kechikdi ⏰', cls: 'bg-amber-500 text-white' },
                        { id: 'excused', label: 'Sababli 📝', cls: 'bg-blue-500 text-white' },
                        { id: 'absent', label: 'Kelmadi ❌', cls: 'bg-rose-500 text-white' }
                      ]
                        .map((b) => `<button type="button" onclick="pickAttendanceStatus(this, '${escapeHtml(name)}', '${b.id}', '${b.cls}')" class="att-btn py-2 rounded-xl text-[11px] font-bold ${cur === b.id ? b.cls : 'bg-white border text-slate-600'}">${b.label}</button>`)
                        .join('')}
                    </div>
                  </div>`;
                })
                .join('')}
            </div>
            <button onclick="saveAttendance('${escapeHtml(sched.id)}')" class="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-bold text-sm mt-2">Davomatni saqlash</button>
          </div>
        </div>
      `;
    }

      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(new Error('Faylni o‘qib bo‘lmadi'));
        r.readAsDataURL(blob);
      });
    }

    async function prepareHomeworkFile(f) {
      const LIMIT = 950000; // base64 matn uzunligi
      if (f.type.startsWith('video/')) throw new Error('Video yuklab bo‘lmaydi. Rasm, audio yoki hujjat tanlang.');
      let data;
      if (f.type.startsWith('image/')) {
        const src = await readAsDataUrl(f);
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Rasmni ochib bo‘lmadi')); i.src = src; });
        const scale = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        data = c.toDataURL('image/jpeg', 0.72);
        return { name: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: data.length <= LIMIT ? data : c.toDataURL('image/jpeg', 0.5) };
      }
      data = await readAsDataUrl(f);
      if (data.length > LIMIT) throw new Error('Fayl juda katta (700 KB gacha). Qisqaroq audio yoki kichikroq fayl tanlang.');
      return { name: f.name, mime: f.type || 'application/octet-stream', data };
    }

    window.submitNewVocab = (e) => {
      e.preventDefault();
      const word = document.getElementById('voc-word').value.trim();
      const translation = document.getElementById('voc-uz').value.trim();
      state.club.vocabList.unshift({ id: 'voc-' + Date.now(), word, transcription: '/.../', translation, example: `We used "${word}".` });
      addXp(15, `Yangi so‘z: ${word}`);
      render();
    };

    // Profil va Kalitlar
    window.toggleProfileKeyPlain = () => { state.showProfileKeyPlain = !state.showProfileKeyPlain; render(); };
    window.activateSecretKeyFromProfile = (e) => {
      e.preventDefault();
      const inp = document.getElementById('profile-key-input');
      if (!inp || !inp.value.trim()) return;
      const res = evaluateSecretKey(inp.value, state.profile.fullName);
      if (!res.valid) { showToast(res.error, 'warning'); return; }
      state.profile.activeRole = res.role;
      state.profile.modExpiresAt = res.expiresAt;
      state.profile.modKeyVersion = res.keyVersion;
      persistAll();
      showToast(res.role === 'super_admin' ? '👑 Bosh Tashkilotchi faollashdi!' : '🛡️ Moderatorlik faollashdi!');
      render();
    };
    window.toggleAdminKeysPlain = () => { state.showAdminKeysPlain = !state.showAdminKeysPlain; render(); };
    window.saveSecuritySettings = (e) => {
      e.preventDefault();
      state.security.tempModKey = document.getElementById('sec-temp-key').value.trim();
      state.security.defaultDurationMinutes = Number(document.getElementById('sec-duration').value) || 60;
      state.security.masterKey = document.getElementById('sec-master-key').value.trim();
      state.security.keyVersion = (state.security.keyVersion || 1) + 1;
      persistAll();
      showToast('🔐 Kalitlar saqlandi!');
      render();
    };
    window.endTempModeratorEarly = () => {
      if (!state.profile) return;
      state.profile.activeRole = state.profile.baseRole || 'learner';
      state.profile.modExpiresAt = null;
      state.profile.modKeyVersion = null;
      persistAll();
      render();
    };
    window.logoutProfile = () => { state.profile = null; persistAll(); render(); };

    (async () => {
      try {
        if (window.EPApi) {
          const remote = await window.EPApi.initialize();
          if (remote && remote.profile && !state.profile) {
            state.profile = remote.profile;
            if (remote.club) state.club = remote.club;
            if (remote.reminders) state.reminders = remote.reminders;
            if (remote.security) state.security = { ...state.security, ...remote.security };
            saveJson(STORAGE_KEYS.PROFILE, state.profile);
            saveJson(STORAGE_KEYS.CLUB, state.club);
            saveJson(STORAGE_KEYS.REMINDERS, state.reminders);
          }
          if (window.EPApi.ready) {
            loadHomework();
            await loadNotifs();
            if (state.notifs.unread) showToast(`🔔 ${state.notifs.unread} ta yangi bildirishnoma`);
            setInterval(() => loadNotifs(true), 60000);
          }
        }
      } catch (err) {
        console.warn('Server sync not available; local mode is active.', err);
      }
      render();
    })();
  </script>
</body>
</html>
