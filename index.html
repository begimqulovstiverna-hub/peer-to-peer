• Present Simple: Subject + V1 (he/she/it uchun fe’lga -s/-es qo‘shiladi)
  - Darak (+): "I speak English every day." / "She works in Tashkent."
  - Inkor (-): "I don't drink coffee." / "He doesn't play football."

  - Darak (+): "I am learning English right now." / "They are practicing speaking."
  - Inkor (-): "He isn't sleeping now."
  - So‘roq (?): "Are you listening to me?"

    // =========================================================================
    // 4. STATE BOSHQARUVI (LOCALSTORAGE PERSISTENCE)
    // =========================================================================
    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJson(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // Ignore storage quota errors
      }
    }

    const state = {
      security: loadJson(STORAGE_KEYS.SECURITY, DEFAULT_SECURITY),
      profile: loadJson(STORAGE_KEYS.PROFILE, null),
      club: loadJson(STORAGE_KEYS.CLUB, INITIAL_CLUB_DATA),
      reminders: loadJson(STORAGE_KEYS.REMINDERS, {}),
      activeTab: 'schedule', // 'schedule' | 'pronunciation' | 'lessons' | 'club' | 'profile'

      onboardingKeyError: '',
      showProfileKeyPlain: false,
      showAdminKeysPlain: false

    function persistAll() {
      saveJson(STORAGE_KEYS.SECURITY, state.security);
      if (state.profile) {
        saveJson(STORAGE_KEYS.PROFILE, state.profile);
      } else {
        localStorage.removeItem(STORAGE_KEYS.PROFILE);
      }
      saveJson(STORAGE_KEYS.CLUB, state.club);
      saveJson(STORAGE_KEYS.REMINDERS, state.reminders);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const isWarn = type === 'warning';
      el.className = `animate-fade-in px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 backdrop-blur-md text-xs font-medium leading-snug ${
        isWarn
          ? 'bg-amber-950/95 text-amber-100 border border-amber-500/40'
          : 'bg-slate-900/95 text-white border border-white/10'
      }`;
      el.innerHTML = `
        <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 ${
          isWarn ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-400'
        }">${isWarn ? '⚠️' : '✓'}</span>
        <span>${escapeHtml(message)}</span>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        el.style.transition = 'all 0.2s ease';
        setTimeout(() => el.remove(), 220);
      }, 3600);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // =========================================================================
    // 5. VAQT FORMATI VA OVOZLI TALAFFUZ (WEB SPEECH API)
    // =========================================================================
    function getRemainingModMs() {
      if (!state.profile || state.profile.activeRole !== 'temp_moderator') return 0;
      const diff = (state.profile.modExpiresAt || 0) - Date.now();
      return Math.max(0, diff);
    }

    function formatRemainingTime(ms) {
      if (ms <= 0) return '00:00';
      const totalSec = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hrs > 0) return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      return `${pad(mins)}:${pad(secs)}`;
    }

    function isSuperAdmin() {
      return state.profile?.activeRole === 'super_admin';
    }

    function isTempModerator() {
      return state.profile?.activeRole === 'temp_moderator' && getRemainingModMs() > 0;
    }

    function hasModeratorPowers() {
      return isSuperAdmin() || isTempModerator();
    }

    function addXp(amount, logText) {
      if (!state.profile) return;
      state.profile.xp = (state.profile.xp || 0) + amount;
      state.profile.history = [
        { text: `${logText} (+${amount} XP)`, time: 'Hozirgina' },
        ...(state.profile.history || []).slice(0, 9)
      ];
      persistAll();
    }

    function evaluateSecretKey(enteredKey, userFullName = 'A’zo') {
      const cleanKey = (enteredKey || '').trim();
      if (!cleanKey) {
        return { valid: false, error: 'Kalit so‘z kiritilmadi.' };
      }

      if (cleanKey === state.security.masterKey) {
        state.security.accessLogs = [
          {
            id: 'log-' + Date.now(),
            user: userFullName,
            action: 'Bosh Tashkilotchi sifatida tizimga kirdi',
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          },
          ...(state.security.accessLogs || []).slice(0, 9)
        ];
        persistAll();
        return {
          valid: true,
          role: 'super_admin',
          expiresAt: null,
          keyVersion: state.security.keyVersion
        };
      }

      if (cleanKey === state.security.tempModKey) {
        const durationMin = state.security.defaultDurationMinutes || 60;
        const expiresAt = Date.now() + durationMin * 60 * 1000;
        state.security.accessLogs = [
          {
            id: 'log-' + Date.now(),
            user: userFullName,
            action: `Vaqtinchalik Moderator oldi (${durationMin} daqiqa)`,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          },
          ...(state.security.accessLogs || []).slice(0, 9)
        ];
        persistAll();
        return {
          valid: true,
          role: 'temp_moderator',
          expiresAt,
          keyVersion: state.security.keyVersion
        };
      }

      return {
        valid: false,
        error: 'Noto‘g‘ri maxsus kalit so‘z! Amaldagi kalitni Bosh Tashkilotchidan oling.'
      };
    }

    function speakEnglish(text, accent = state.ttsAccent, rate = state.ttsRate) {
      if (!text || !text.trim()) return;
      if (typeof window === 'undefined' || !('speechSynthesis' in window)) {
        showToast('Brauzeringizda ovozli o‘qish (TTS) qo‘llab-quvvatlanmaydi.', 'warning');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.trim());
        utter.lang = accent;
        utter.rate = rate;

        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const matched =
          voices.find((v) => v.lang === accent && (v.name.includes('Google') || v.name.includes('Natural'))) ||
          voices.find((v) => v.lang && v.lang.startsWith(accent.slice(0, 5))) ||
          voices.find((v) => v.lang && v.lang.startsWith('en'));

        if (matched) {
          utter.voice = matched;
        }
        window.speechSynthesis.speak(utter);
      } catch {
        showToast('Ovozni ijro etishda xatolik yuz berdi.', 'warning');
      }
    }

    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // =========================================================================
    // 6. MUDDAT TAYMERI (HAR SONIYADA TEKSHIRADI)
    // =========================================================================
    setInterval(() => {
      if (!state.profile) return;
      if (state.profile.activeRole === 'temp_moderator') {
        const now = Date.now();
        const expired = now >= (state.profile.modExpiresAt || 0);
        const rotated = state.profile.modKeyVersion !== state.security.keyVersion;

        if (expired || rotated) {
          const fallback = state.profile.baseRole || 'learner';
          state.profile.activeRole = fallback;
          state.profile.modExpiresAt = null;
          state.profile.modKeyVersion = null;
          state.profile.history = [
            {
              text: rotated
                ? 'Kalit yangilandi yoki sessiya bekor qilindi — oddiy rolga qaytdingiz'
                : 'Moderatorlik muddati tugadi — oddiy rolga qaytdingiz',
              time: 'Hozirgina'
            },
            ...(state.profile.history || []).slice(0, 9)
          ];
          persistAll();
          showToast(
            rotated
              ? '⚠️ Bosh Tashkilotchi kalitni o‘zgartirdi. Oddiy rolingizga qaytdingiz.'
              : '⏳ Moderatorlik muddati tugadi! Oddiy rolingizga qaytdingiz.',
            'warning'
          );
          render();
          return;
        }
      }
      // Header va profil taymerlarini yangilash
      const timerEl = document.getElementById('live-mod-timer');
      if (timerEl) {
        timerEl.textContent = formatRemainingTime(getRemainingModMs());
      }
      const profileTimerEl = document.getElementById('profile-mod-timer');
      if (profileTimerEl) {
        profileTimerEl.textContent = formatRemainingTime(getRemainingModMs());
      }
    }, 1000);

            state.lessonsTab === 'quiz'

                !state.quizFinished
                  ? `

                    <span class="text-xs font-bold text-amber-600">Ball: ${state.quizScore * 15} XP</span>
                  </div>
                  <h3 class="font-bold text-base text-slate-900">${escapeHtml(q.question)}</h3>

                    ${q.options
                      .map((opt, idx) => {
                        const answered = state.quizSelected !== null;
                        const isCorrect = idx === q.correctIndex;
                        const isPicked = idx === state.quizSelected;
                        let cls = 'bg-slate-50 border-slate-200 text-slate-800';
                        if (answered) {
                          if (isCorrect) cls = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                          else if (isPicked) cls = 'bg-rose-50 border-rose-500 text-rose-900';
                        }
                        return `<button ${answered ? 'disabled' : ''} onclick="selectQuizOption(${idx})" class="w-full text-left p-3.5 rounded-2xl border text-xs ${cls}">${escapeHtml(opt)}</button>`;
                      })
                      .join('')}
                  </div>
                  ${
                    state.quizSelected !== null
                      ? `<div class="p-3 rounded-2xl bg-indigo-50 text-indigo-900 text-xs"><strong>Izoh:</strong> ${escapeHtml(q.explanation)}</div>

              `

                  <div class="text-4xl">🏆</div>
                  <h3 class="text-xl font-extrabold">Test yakunlandi!</h3>

                  <button onclick="restartQuiz()" class="px-6 py-3 rounded-2xl bg-indigo-600 text-white text-xs font-bold">Qaytadan ishlash</button>

              `
              }
            </div>
          `
              : `
            <div class="space-y-4">
              <form id="homework-form" onsubmit="submitHomeworkForm(event)" class="bg-white rounded-3xl p-4 border border-slate-200/80 space-y-3">

                <select id="hw-lesson" class="w-full px-3 py-2.5 rounded-xl border text-xs bg-white">
                  ${state.club.schedules.map((s) => `<option value="${escapeHtml(s.topic)}">${escapeHtml(s.day)}: ${escapeHtml(s.topic)}</option>`).join('')}
                </select>
                <textarea id="hw-text" required rows="3" placeholder="Dars mavzusi bo‘yicha inglizcha gaplaringizni yozing..." class="w-full p-3 rounded-2xl border text-xs"></textarea>
                <button type="submit" class="w-full py-3 rounded-2xl bg-indigo-600 text-white font-bold text-xs">Vazifani yuborish</button>
              </form>

              ${state.club.submissions
                .map(
                  (sub) => `
                <div class="bg-white rounded-3xl p-4 border border-slate-200/80 space-y-2">
                  <div class="flex justify-between items-center">
                    <span class="font-bold text-xs">${escapeHtml(sub.userName)}</span>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">${sub.status === 'Reviewed' ? 'Tekshirilgan ✅' : 'Kutilmoqda'}</span>
                  </div>
                  <div class="text-[11px] font-semibold text-indigo-600">${escapeHtml(sub.lessonTitle)}</div>
                  <p class="text-xs bg-slate-50 p-3 rounded-2xl whitespace-pre-line">${escapeHtml(sub.answerText)}</p>
                  ${
                    sub.mentorComment
                      ? `<div class="bg-emerald-50 p-2.5 rounded-xl text-xs text-emerald-900"><strong>Izoh:</strong> ${escapeHtml(sub.mentorComment)}</div>`
                      : `<div class="flex gap-2">
                          <input id="rev-input-${escapeHtml(sub.id)}" placeholder="Tengdosh sifatida tekshiring (+15 XP)..." class="flex-1 px-3 py-2 rounded-xl border text-xs" />
                          <button onclick="reviewHomeworkItem('${escapeHtml(sub.id)}')" class="px-3 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">Baholash</button>
                        </div>`
                  }
                </div>
              `
                )
                .join('')}
            </div>
          `
          }
        </div>
      `;
    }

              <h3 class="font-extrabold text-sm text-slate-900">🔑 Maxsus Kalit Bilan Kirish</h3>

    window.toggleOnboardingInterest = (btn) => {
      const active = btn.classList.toggle('active-interest');
      const label = btn.getAttribute('data-interest');
      if (active) {
        btn.className = 'onb-interest-btn active-interest px-3 py-1.5 rounded-full text-xs font-semibold transition-all bg-indigo-600 text-white';
        btn.textContent = '✓ ' + label;
      } else {

        btn.textContent = '+ ' + label;
      }
    };

    window.toggleOnboardingKeyBox = () => {
      state.showOnboardingKeyBox = !state.showOnboardingKeyBox;
      state.onboardingKeyError = '';
      render();
    };

    window.toggleOnboardingKeyPlain = () => {
      state.showOnboardingKeyPlain = !state.showOnboardingKeyPlain;
      render();
    };

    document.addEventListener('submit', (e) => {
      if (e.target && e.target.id === 'onboarding-form') {
        e.preventDefault();
        const fullName = document.getElementById('onb-fullname').value.trim();
        const group = document.getElementById('onb-group').value;
        const level = document.getElementById('onb-level').value;
        const interests = Array.from(document.querySelectorAll('.onb-interest-btn.active-interest')).map((el) =>
          el.getAttribute('data-interest')
        );

        let activeRole = 'learner';
        let modExpiresAt = null;
        let modKeyVersion = null;

        const keyEl = document.getElementById('onb-secret-key');
        if (keyEl && keyEl.value.trim()) {
          const check = evaluateSecretKey(keyEl.value, fullName);
          if (!check.valid) {
            state.onboardingKeyError = check.error;
            render();
            return;
          }
          activeRole = check.role;
          modExpiresAt = check.expiresAt;
          modKeyVersion = check.keyVersion;
        }

        state.profile = {
          fullName,
          group,
          level,
          interests: interests.length ? interests : ['Speaking'],
          baseRole: 'learner',
          activeRole,
          modExpiresAt,
          modKeyVersion,
          xp: 50,
          streak: 1,
          history: [{ text: 'English Peers klubiga qo‘shildi (+50 XP)', time: 'Hozirgina' }]
        };
        persistAll();
        showToast('🎉 English Peers klubiga xush kelibsiz! (+50 XP)');
        render();
      }
    });

      render();

      const sched = state.club.schedules.find((s) => s.id === schedId);
      if (!sched || !state.profile) return;
      const name = state.profile.fullName;
      const exists = (sched.rsvps || []).includes(name);
      if (exists) {
        sched.rsvps = sched.rsvps.filter((n) => n !== name);
        persistAll();
        showToast('Ro‘yxatdan chiqdingiz.');
      } else {
        sched.rsvps = [...(sched.rsvps || []), name];
        addXp(10, `Darsga yozildi: ${sched.day}`);
        showToast('Darsga yozildingiz! +10 XP ✅');

      render();

      sched.speakerName = state.profile.fullName;
      sched.rsvps = Array.from(new Set([...(sched.rsvps || []), state.profile.fullName]));

      if (!pair) return;
      const chosen = Math.random() < 0.5 ? pair.wordA : pair.wordB;
      state.earQuizTarget = { pairId, answerWord: chosen };
      state.earQuizFeedback = null;
      render();
      speakEnglish(chosen, state.ttsAccent, 0.9);
    };

      if (!state.earQuizTarget || state.earQuizTarget.pairId !== pairId) return;
      const correct = picked === state.earQuizTarget.answerWord;
      state.earQuizFeedback = {
        pairId,
        correct,
        msg: correct
          ? `✅ To‘g‘ri! Siz "${state.earQuizTarget.answerWord}" so‘zini aniq eshitdingiz!`
          : `❌ Bu "${state.earQuizTarget.answerWord}" edi. Qayta tinglab farqlang!`

      if (correct) addXp(10, `Quloq testini topdi (${picked})`);

      speakEnglish(txt, state.ttsAccent, 1.0);
      addXp(5, 'Tez aytish mashqini bajardi');
      showToast('Tez aytish ijro etildi! (+5 XP)');
    };

    window.practiceShadowing = (txt) => {
      speakEnglish(txt, state.ttsAccent, 0.9);
      addXp(10, 'Shadowing mashqini bajardi');
      showToast('Shadowing mashqi! Diktor bilan takrorlang (+10 XP)');
    };

    window.runMicCheck = () => {
      state.micError = '';
      state.spokenResult = null;
      const SR = typeof window !== 'undefined' && (window.SpeechRecognition || window.webkitSpeechRecognition);
      if (!SR) {
        state.micError = 'Sizning brauzeringiz jonli mikrofon tanishni qo‘llab-quvvatlamaydi (Chrome da sinab ko‘ring).';
        render();
        return;
      }
      const rec = new SR();
      rec.lang = state.ttsAccent;
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      showToast('🎙️ Mikrofon yoqildi — gapiring...', 'success');
      rec.start();
      rec.onresult = (ev) => {
        const transcript = ev.results[0][0].transcript;
        const targetWords = (state.micTargetPhrase || '').toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(Boolean);
        const spokenWords = transcript.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(Boolean);
        let match = 0;
        targetWords.forEach((w) => {
          if (spokenWords.includes(w)) match++;
        });
        const accuracy = targetWords.length ? Math.round((match / targetWords.length) * 100) : 0;
        state.spokenResult = { transcript, accuracy };
        if (accuracy >= 70) addXp(15, `Jonli talaffuz tekshiruvi (${accuracy}%)`);
        render();
      };
      rec.onerror = () => {
        state.micError = 'Ovoz aniqlanmadi yoki mikrofon ruxsati berilmagan.';
        render();
      };
    };

    // Mashqlar & Uy vazifasi
    window.setLessonsTab = (t) => {
      state.lessonsTab = t;
      render();
    };
    window.selectQuizOption = (idx) => {
      if (state.quizSelected !== null) return;
      state.quizSelected = idx;
      if (idx === QUIZ_QUESTIONS[state.quizIndex].correctIndex) state.quizScore++;
      render();
    };
    window.nextQuizStep = () => {
      if (state.quizIndex + 1 < QUIZ_QUESTIONS.length) {
        state.quizIndex++;
        state.quizSelected = null;
      } else {
        state.quizFinished = true;
        addXp(state.quizScore * 15, `Mini-test (${state.quizScore}/${QUIZ_QUESTIONS.length})`);
      }
      render();
    };
    window.restartQuiz = () => {
      state.quizIndex = 0;
      state.quizSelected = null;
      state.quizScore = 0;
      state.quizFinished = false;
      render();
    };
    window.submitHomeworkForm = (e) => {
      e.preventDefault();
      const lessonTitle = document.getElementById('hw-lesson').value;
      const answerText = document.getElementById('hw-text').value.trim();
      if (!answerText) return;
      state.club.submissions.unshift({
        id: 'sub-' + Date.now(),
        userName: state.profile.fullName,
        lessonTitle,
        answerText,
        status: 'Pending',
        mentorComment: ''
      });
      addXp(25, 'Uy vazifasini topshirdi');
      showToast('Uy vazifasi yuborildi! (+25 XP) 📝');
      render();
    };
    window.reviewHomeworkItem = (subId) => {
      const inp = document.getElementById('rev-input-' + subId);
      if (!inp || !inp.value.trim()) return;
      const sub = state.club.submissions.find((s) => s.id === subId);
      if (!sub) return;
      sub.status = 'Reviewed';
      sub.mentorComment = `${inp.value.trim()} — (${state.profile.fullName})`;
      addXp(15, 'Tengdosh vazifasini tekshirdi');
      showToast('Fikr qoldirildi! (+15 XP) 🤝');
      render();
    };

    // Jamoa hayoti
    window.setClubTab = (t) => {
      state.clubTab = t;
      render();
    };
    window.submitAnnouncement = (e) => {
      e.preventDefault();
      const title = document.getElementById('ann-title').value.trim();
      const body = document.getElementById('ann-body').value.trim();
      if (!title || !body) return;
      state.club.announcements.unshift({
        id: 'ann-' + Date.now(),
        title,
        body,
        author: `${state.profile.fullName} (${isSuperAdmin() ? 'Bosh Tashkilotchi' : 'Moderator'})`,
        date: 'Hozirgina'
      });
      persistAll();
      showToast('E’lon chop etildi! 📢');
      render();
    };
    window.submitPeerReview = (e) => {
      e.preventDefault();
      const targetName = document.getElementById('rev-target').value.trim();
      const wentWell = document.getElementById('rev-good').value.trim();
      const toImprove = document.getElementById('rev-improve').value.trim() || 'Ajoyib ishtirok!';
      if (!targetName || !wentWell) return;
      state.club.reviews.unshift({
        id: 'rev-' + Date.now(),
        targetName,
        wentWell,
        toImprove,
        authorName: state.profile.fullName,
        createdAt: 'Hozirgina'
      });
      addXp(20, `Peer Review: ${targetName}`);
      showToast('Konstruktiv fikringiz saqlandi! (+20 XP) 🌟');
      render();
    };
    window.submitQuestion = (e) => {
      e.preventDefault();
      const q = document.getElementById('qa-question').value.trim();
      if (!q) return;
      state.club.qaList.unshift({
        id: 'qa-' + Date.now(),
        question: q,
        authorName: `${state.profile.fullName} (${state.profile.level})`,
        createdAt: 'Hozirgina',
        replies: []
      });
      addXp(10, 'Savol berdi');
      showToast('Savolingiz joylandi! (+10 XP)');
      render();
    };
    window.submitReply = (qaId) => {
      const inp = document.getElementById('qa-reply-' + qaId);
      if (!inp || !inp.value.trim()) return;
      const item = state.club.qaList.find((x) => x.id === qaId);
      if (!item) return;
      item.replies.push({ id: 'rep-' + Date.now(), authorName: state.profile.fullName, text: inp.value.trim() });
      addXp(15, 'Savolga javob berdi');
      showToast('Javobingiz qo‘shildi! (+15 XP)');
      render();
    };
    window.flipVocabCard = () => {
      state.vocabFlipped = !state.vocabFlipped;
      render();
    };
    window.prevVocabCard = () => {
      state.vocabFlipped = false;
      state.vocabIndex = (state.vocabIndex - 1 + state.club.vocabList.length) % state.club.vocabList.length;
      render();
    };
    window.nextVocabCard = () => {
      state.vocabFlipped = false;
      state.vocabIndex = (state.vocabIndex + 1) % state.club.vocabList.length;
      render();
    };
    window.submitNewVocab = (e) => {
      e.preventDefault();
      const word = document.getElementById('voc-word').value.trim();
      const translation = document.getElementById('voc-uz').value.trim();
      if (!word || !translation) return;
      state.club.vocabList.unshift({
        id: 'voc-' + Date.now(),
        word,
        transcription: '/.../',
        translation,
        example: `We practiced "${word}" in our club.`
      });
      addXp(15, `Yangi so‘z: ${word}`);
      showToast(`"${word}" lug‘atga qo‘shildi! (+15 XP)`);
      render();
    };

    // Profil va xavfsizlik handlerlari
    window.setBaseRole = (role) => {
      if (!state.profile || isSuperAdmin() || isTempModerator()) return;
      state.profile.baseRole = role;
      state.profile.activeRole = role;
      persistAll();
      showToast(`Rol o‘zgartirildi: ${role === 'speaker' ? 'Spiker / Mentor' : 'Ishtirokchi'}`);
      render();
    };

    window.toggleProfileKeyPlain = () => {
      state.showProfileKeyPlain = !state.showProfileKeyPlain;
      render();
    };

    window.activateSecretKeyFromProfile = (e) => {
      e.preventDefault();
      const inp = document.getElementById('profile-key-input');
      if (!inp || !inp.value.trim()) return;
      const res = evaluateSecretKey(inp.value, state.profile.fullName);
      if (!res.valid) {
        showToast(res.error, 'warning');
        return;
      }
      state.profile.activeRole = res.role;
      state.profile.modExpiresAt = res.expiresAt;
      state.profile.modKeyVersion = res.keyVersion;
      state.profile.history = [
        {
          text:
            res.role === 'super_admin'
              ? 'Bosh Tashkilotchi huquqi faollashtirildi'
              : `Vaqtinchalik Moderator huquqi faollashtirildi (${state.security.defaultDurationMinutes} daq)`,
          time: 'Hozirgina'
        },
        ...(state.profile.history || []).slice(0, 9)
      ];
      persistAll();
      showToast(
        res.role === 'super_admin'
          ? '👑 Bosh Tashkilotchi paneli faollashdi!'
          : `🛡️ Moderatorlik ${state.security.defaultDurationMinutes} daqiqaga faollashdi!`
      );
      render();
    };

    window.toggleAdminKeysPlain = () => {
      state.showAdminKeysPlain = !state.showAdminKeysPlain;
      render();
    };

    window.saveSecuritySettings = (e) => {
      e.preventDefault();
      const tempKey = document.getElementById('sec-temp-key').value.trim();
      const duration = Number(document.getElementById('sec-duration').value) || 60;
      const masterKey = document.getElementById('sec-master-key').value.trim();
      if (!tempKey || !masterKey) return;

      state.security.tempModKey = tempKey;
      state.security.defaultDurationMinutes = duration;
      state.security.masterKey = masterKey;
      state.security.keyVersion = (state.security.keyVersion || 1) + 1;
      state.security.accessLogs = [
        {
          id: 'log-' + Date.now(),
          user: state.profile.fullName,
          action: `Kalit so‘z va muddat (${duration} daq) yangilandi`,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        },
        ...(state.security.accessLogs || []).slice(0, 9)
      ];
      persistAll();
      showToast('🔐 Yangi kalit so‘z va sozlamalar saqlandi!');
      render();
    };

    window.revokeAllTempMods = () => {
      state.security.keyVersion = (state.security.keyVersion || 1) + 1;
      state.security.accessLogs = [
        {
          id: 'log-' + Date.now(),
          user: state.profile.fullName,
          action: 'Barcha vaqtinchalik moderatorlar bekor qilindi',
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        },
        ...(state.security.accessLogs || []).slice(0, 9)
      ];
      persistAll();
      showToast('🛑 Barcha vaqtinchalik moderator sessiyalari bekor qilindi!');
      render();
    };

    window.setTestFiveSeconds = () => {
      if (!state.profile || state.profile.activeRole !== 'temp_moderator') return;
      state.profile.modExpiresAt = Date.now() + 5000;
      persistAll();
      showToast('🧪 5 soniya qoldirildi — muddat tugashini kuzating!');
      render();
    };

    window.endTempModeratorEarly = () => {
      if (!state.profile) return;
      state.profile.activeRole = state.profile.baseRole || 'learner';
      state.profile.modExpiresAt = null;
      state.profile.modKeyVersion = null;
      persistAll();
      showToast('Oddiy rolingizga qaytdingiz.');
      render();
    };

    window.logoutProfile = () => {
      state.profile = null;
      persistAll();
      render();
    };

    // Dastlabki render
    render();
  </script>
</body>
</html>
